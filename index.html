let songs=unique(SEED),history=[],cloud=null,loggedInAdmin=false,working=false,drawTimer=null,cloudMode='notConfigured',result=null;
try{const a=JSON.parse(localStorage.getItem(KEY_HISTORY)||'[]');if(Array.isArray(a))history=a.filter(x=>typeof x==='string').slice(-300)}catch{}
const configured=!!(CLOUD_CONFIG.url&&CLOUD_CONFIG.anonKey&&CLOUD_CONFIG.roomId);
if(configured&&window.supabase?.createClient){cloud=window.supabase.createClient(CLOUD_CONFIG.url,CLOUD_CONFIG.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}})}
function mark(k){cloudMode=k;$('syncStatus').textContent=t(k)}
function publicMsg(s=''){$('publicMessage').textContent=s}
function adminMsg(s=''){$('adminMessage').textContent=s}
function applyLanguage(){document.documentElement.lang=lang;document.title=t('title');$('language').value=lang;document.querySelectorAll('[data-i18n]').forEach(e=>{e.textContent=t(e.dataset.i18n)});document.querySelectorAll('[data-i18n-placeholder]').forEach(e=>{e.placeholder=t(e.dataset.i18nPlaceholder)});mark(cloudMode);render()}
function showAdmin(){const show=loggedInAdmin;$('loginPane').hidden=show;$('adminPane').hidden=!show;render()}
function render(){songs=unique(songs);$('songCount').textContent=songs.length;$('drawCount').textContent=history.length;if(!drawTimer)$('result').textContent=result?localized(result):t('ready');$('adminCount').textContent=songs.length+' '+t('songUnit');const q=normalized($('search').value),list=$('songList');list.replaceChildren();if(loggedInAdmin){const matches=songs.filter(x=>normalized(x).includes(q));matches.forEach(song=>{const row=document.createElement('div');row.className='item';const span=document.createElement('span');span.textContent=localized(song);const del=document.createElement('button');del.textContent=t('delete');del.disabled=working;del.onclick=async()=>{if(!confirm(t('confirmDelete',localized(song))))return;await mutate(songs.filter(s=>s!==song),t('deleted'))};row.append(span,del);list.append(row)});if(!matches.length)list.textContent=t('noResults')}}
async function readCloud(){if(!cloud){mark('notConfigured');render();return}mark('loading');const {data,error}=await cloud.from('song_rooms').select('songs').eq('room_id',CLOUD_CONFIG.roomId).maybeSingle();if(error){mark('syncFailed');publicMsg(error.message);return}publicMsg();if(data){songs=unique(data.songs||[]);mark('connected')}else{songs=[];mark('emptyCloud')}render()}
async function checkAdmin(){if(!cloud){loggedInAdmin=false;showAdmin();return}const {data:{user}}=await cloud.auth.getUser();if(!user){loggedInAdmin=false;showAdmin();return}const {data,error}=await cloud.from('song_admins').select('user_id').eq('user_id',user.id).maybeSingle();loggedInAdmin=!error&&!!data;showAdmin();if(error)adminMsg(error.message)}
async function mutate(next,message){if(!cloud||!loggedInAdmin){adminMsg(t('mustAdmin'));return}if(working)return;working=true;try{const updated=unique(next);const {error}=await cloud.from('song_rooms').upsert({room_id:CLOUD_CONFIG.roomId,songs:updated,updated_at:new Date().toISOString()},{onConflict:'room_id'});if(error)throw error;songs=updated;mark('connected');adminMsg(message||t('saved'));render()}catch(e){adminMsg(t('writeFailed')+e.message);await readCloud()}finally{working=false;render()}}
async function login(e){e.preventDefault();if(!cloud){adminMsg(t('needCloud'));return}adminMsg('');const username=$('adminEmail').value.trim().toLowerCase(),password=$('password').value;if(!/^[a-z0-9_]{3,32}$/.test(username)){adminMsg(t('invalidUsername'));return}const email=username+'@login.yuli.invalid';const {error}=await cloud.auth.signInWithPassword({email,password});$('password').value='';if(error){adminMsg(t('loginFailed')+error.message);return}await checkAdmin();if(!loggedInAdmin){adminMsg(t('notAdmin'));await cloud.auth.signOut();showAdmin()}else{adminMsg(t('signedIn'));await readCloud()}}
function draw(){if(!songs.length){publicMsg(t('cannotDraw'));return}const last=history.at(-1),choices=songs.filter(s=>normalized(s)!==normalized(last)),pool=choices.length?choices:songs,chosen=pool[Math.floor(Math.random()*pool.length)];$('draw').disabled=true;let ticks=0;drawTimer=setInterval(()=>{const n=songs[Math.floor(Math.random()*songs.length)];$('result').textContent=localized(n);if(++ticks>=17){clearInterval(drawTimer);drawTimer=null;result=chosen;history.push(chosen);history=history.slice(-300);try{localStorage.setItem(KEY_HISTORY,JSON.stringify(history))}catch{}$('draw').disabled=false;render()}},80)}
$('language').onchange=e=>{lang=e.target.value;try{localStorage.setItem(KEY_LANG,lang)}catch{}applyLanguage()};$('draw').onclick=draw;$('refresh').onclick=readCloud;
$('adminToggle').onclick=async()=>{const box=$('adminBox');box.hidden=!box.hidden;if(!box.hidden){if(!cloud)adminMsg(t('needCloud'));else await checkAdmin()}};
$('loginForm').onsubmit=login;$('logout').onclick=async()=>{if(cloud)await cloud.auth.signOut();loggedInAdmin=false;showAdmin();adminMsg('')};
$('add').onclick=async()=>{const add=$('entry').value.split(/[\r\n]+/).map(s=>s.trim()).filter(Boolean);const next=unique([...songs,...add]);await mutate(next,t('added',next.length-songs.length));$('entry').value=''};
$('seed').onclick=async()=>{if(confirm(t('confirmSeed'))){const next=unique([...songs,...SEED]);await mutate(next,t('seeded',next.length))}};
$('search').oninput=render;
$('export').onclick=()=>{if(!loggedInAdmin)return;const b=new Blob([JSON.stringify({title:t('title'),songs,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});const link=document.createElement('a');link.href=URL.createObjectURL(b);link.download=t('exportName');link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1500)};
$('import').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const raw=await f.text(),j=f.name.toLowerCase().endsWith('.json')?JSON.parse(raw):raw.split(/\r?\n/),incoming=Array.isArray(j)?j:j.songs;if(!Array.isArray(incoming))throw Error('Invalid file');const next=unique([...songs,...incoming]);await mutate(next,t('added',next.length-songs.length))}catch(err){adminMsg(t('importFailed')+err.message)}e.target.value=''};
applyLanguage();readCloud();if(cloud)checkAdmin();
</script></body></html>
